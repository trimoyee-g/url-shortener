<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Protected link · TrimIt</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: #080C10;
      font-family: 'IBM Plex Mono', 'Courier New', monospace;
      color: #E6EDF3;
    }
    .card {
      width: 100%; max-width: 380px;
      background: #0D1117;
      border: 1px solid #1C2128;
      border-radius: 14px;
      padding: 36px 32px;
      margin: 16px;
    }
    .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; }
    .logo-icon {
      width: 28px; height: 28px;
      background: rgba(56,189,248,0.1);
      border: 1px solid rgba(56,189,248,0.2);
      border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px;
    }
    .logo-text { color: #38BDF8; font-size: 14px; font-weight: 700; letter-spacing: 0.1em; }
    .badge {
      display: inline-flex; align-items: center; gap: 8px;
      background: rgba(56,189,248,0.05);
      border: 1px solid rgba(56,189,248,0.15);
      border-radius: 20px; padding: 5px 12px; margin-bottom: 20px;
      font-size: 11px; color: #6B7280;
    }
    .badge-dot { width: 6px; height: 6px; border-radius: 50%; background: #F59E0B; flex-shrink: 0; }
    h1 { font-size: 20px; font-weight: 700; margin-bottom: 6px;
         font-family: 'Syne', sans-serif; letter-spacing: -0.01em; }
    .sub { font-size: 12px; color: #6B7280; margin-bottom: 24px; line-height: 1.6; }
    label { display: block; font-size: 11px; color: #6B7280; letter-spacing: 0.08em; margin-bottom: 8px; }
    input[type="password"] {
      width: 100%; height: 44px;
      background: #080C10; color: #E6EDF3;
      border: 1px solid #1C2128; border-radius: 8px;
      padding: 0 14px; font-family: inherit; font-size: 14px;
      outline: none; transition: border-color 0.18s;
      margin-bottom: 16px;
    }
    input[type="password"]:focus { border-color: rgba(56,189,248,0.45); }
    button {
      width: 100%; height: 44px;
      background: #38BDF8; color: #080C10;
      border: none; border-radius: 8px;
      font-family: inherit; font-size: 14px; font-weight: 700;
      cursor: pointer; transition: background 0.15s, transform 0.15s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    button:hover:not(:disabled) { background: #7DD3FC; transform: translateY(-1px); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .error {
      display: none; margin-top: 14px;
      background: rgba(248,113,113,0.08);
      border: 1px solid rgba(248,113,113,0.25);
      border-radius: 8px; padding: 10px 14px;
      font-size: 12px; color: #F87171; line-height: 1.5;
    }
    .error.visible { display: block; }
    .spinner {
      width: 16px; height: 16px; border-radius: 50%;
      border: 2px solid rgba(8,12,16,0.3); border-top-color: #080C10;
      animation: spin 0.7s linear infinite; display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Syne:wght@700&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-icon">⚡</div>
      <span class="logo-text">TrimIt</span>
    </div>
    <div class="badge">
      <span class="badge-dot"></span>
      <span id="badge-code"></span>
    </div>
    <h1>Protected link</h1>
    <p class="sub">This link is password-protected.<br>Enter the password to continue.</p>
    <label for="pw">PASSWORD</label>
    <input id="pw" type="password" placeholder="········" autofocus />
    <button id="btn" onclick="unlock()">
      <span id="btn-label">Continue</span>
      <div class="spinner" id="spinner"></div>
    </button>
    <div class="error" id="err"></div>
  </div>
  <script>
    const shortCode = new URLSearchParams(window.location.search).get('code') || '';
    document.getElementById('badge-code').textContent = 'trim.it/' + shortCode;

    document.getElementById('pw').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') unlock();
    });

    async function unlock() {
      const pw  = document.getElementById('pw').value;
      const btn = document.getElementById('btn');
      const err = document.getElementById('err');
      const lbl = document.getElementById('btn-label');
      const spn = document.getElementById('spinner');

      if (!pw) { showError('Please enter the password.'); return; }

      btn.disabled = true;
      lbl.textContent = 'Checking…';
      spn.style.display = 'block';
      err.classList.remove('visible');

      try {
        const res = await fetch('/' + shortCode + '/unlock', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pw }),
        });

        if (res.ok) {
          const data = await res.json();
          lbl.textContent = 'Redirecting…';
          window.location.href = data.redirectUrl;
        } else {
          const body = await res.json().catch(() => ({}));
          showError(body.message || 'Incorrect password. Please try again.');
        }
      } catch (e) {
        showError('Something went wrong. Please try again.');
      } finally {
        btn.disabled = false;
        lbl.textContent = 'Continue';
        spn.style.display = 'none';
      }
    }

    function showError(msg) {
      const err = document.getElementById('err');
      err.textContent = msg;
      err.classList.add('visible');
      document.getElementById('pw').focus();
    }
  </script>
</body>
</html>
